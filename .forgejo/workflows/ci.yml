name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: lean   # leanprovercommunity/lean:latest (no node -> manual checkout)
    steps:
      - name: Checkout
        run: git clone --depth 1 "http://x-access-token:${{ github.token }}@forgejo:3000/${{ github.repository }}.git" .
      - name: Build singular_moduli
        run: |
          cd singular_moduli
          # Download Mathlib's prebuilt cache for the pinned rev (v4.28.0),
          # otherwise lake would compile all of Mathlib from source.
          lake exe cache get
          lake build
      - name: Check and build the proof blueprint
        run: |
          apt-get update
          apt-get install -y python3 python3-pip graphviz libgraphviz-dev \
            build-essential texlive-binaries
          python3 -m pip install --break-system-packages -r blueprint/requirements.txt
          leanblueprint web
          leanblueprint checkdecls
      - name: Build API documentation
        run: |
          cd singular_moduli/docbuild
          DOCGEN_SRC=file lake build QuadraticOrder:docs
